name: Build HBB WiFi Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name hbb_wifi_manager --org com.hbbdigital .

      - name: Configure Google Services plugin for Firebase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app_gradle.exists():
              raise SystemExit("Fichiers Gradle attendus introuvables.")

          settings_text = settings.read_text()
          app_text = app_gradle.read_text()

          plugin_line = '    id("com.google.gms.google-services") version "4.4.4" apply false'
          if "com.google.gms.google-services" not in settings_text:
              marker = "plugins {"
              if marker not in settings_text:
                  raise SystemExit("Bloc plugins introuvable dans settings.gradle.kts.")
              settings_text = settings_text.replace(
                  marker, marker + "\n" + plugin_line, 1
              )
              settings.write_text(settings_text)

          app_plugin = '    id("com.google.gms.google-services")'
          if "com.google.gms.google-services" not in app_text:
              marker = "plugins {"
              if marker not in app_text:
                  raise SystemExit("Bloc plugins introuvable dans app/build.gradle.kts.")
              app_text = app_text.replace(
                  marker, marker + "\n" + app_plugin, 1
              )
              app_gradle.write_text(app_text)

          if not Path("android/app/google-services.json").exists():
              raise SystemExit("google-services.json est absent.")
          PY

      - name: Restore fixed signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create signing key if missing
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Android for notifications
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()
          if "isCoreLibraryDesugaringEnabled" not in g:
              if "compileOptions {" not in g:
                  raise SystemExit("compileOptions introuvable.")
              g = g.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )
              g = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            isMinifyEnabled = false\n            isShrinkResources = false",
                  g,
                  count=1,
              )
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              gradle.write_text(g)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if "ScheduledNotificationReceiver" not in m:
              perms = (
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
                  '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
                  '    '
              )
              receivers = (
                  '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '      <intent-filter>\n'
                  '        <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '        <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '        <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '        <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '      </intent-filter>\n'
                  '    </receiver>\n'
                  '  '
              )
              m = m.replace("<application", perms + "<application", 1)
              m = m.replace("</application>", receivers + "</application>", 1)
              manifest.write_text(m)
          PY

      - name: Add notification packages
        run: flutter pub add flutter_local_notifications:^19.0.0 timezone

      - name: Install dependencies
        run: flutter pub get
      - name: Generate app icons
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release

      - name: Display APK certificate fingerprints
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HBB-WiFi-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
