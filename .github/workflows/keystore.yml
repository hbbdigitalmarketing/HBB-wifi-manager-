name: Generate keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          keytool -genkey -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
